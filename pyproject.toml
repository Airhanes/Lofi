[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lofi"
version = "0.1.0"
description = "Production pipeline for a soulful lofi YouTube channel"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "PyYAML>=6", "Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
upload = ["google-api-python-client>=2", "google-auth-oauthlib>=1"]
genai = ["google-genai>=1"]

[project.scripts]
lofi = "lofi.cli:app"

[tool.setuptools]
packages = ["lofi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
